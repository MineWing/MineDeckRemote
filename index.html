<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="oklch(0.2191 0.0058 285.9113)" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="description" content="MineDeck Minecraft server manager" />
    <title>MineDeck</title>
    <script>
      try {
        const theme = localStorage.getItem('minedeck-theme') === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.classList.toggle('dark', theme === 'dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
